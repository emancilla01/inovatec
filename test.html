<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hover Image Test</title>
  <!-- git repository https://github.com/emancilla01/inovatec.git -->
  <style>
    
  </style>
</head>
<body>
    <div class="mapa" id="mapa">    
      <div class="map-content" id="mapContent" >  
        <div class="legend">
          <ul>
            <li data-target="building-9">9 - Edificio K</li>
            <li data-target="building-10">10 - Laboratorio de electrónica</li>
            <li data-target="building-11">11 - Sistemas y Computación</li>
            <li data-target="building-12">12 - Laboratorio Cómputo Industrial</li>
          </ul>
        </div>
    
    <div class="edificio-container" id="building-9" style="top: 400px; left: 400px;">
      <div class="edificio" style="width: 150px; height: 70px;">9</div>
      <img src="imagenes/p9.png" alt="Edificio 9" class="hover-image">
    </div>
    <div class="edificio-container" id="building-10" style="top: 300px; left: 325px;">
      <div class="edificio" style="width: 70px; height: 60px;">10</div>
      <img src="imagenes/p10.png" alt="Edificio 10" class="hover-image">
    </div>
    <div class="edificio-container" id="building-11" style="top: 200px; left: 315px;">
      <div class="edificio" style="width: 80px; height: 70px;">11</div>
      <img src="imagenes/p11.png" alt="Edificio 11" class="hover-image">
    </div>
    <div class="edificio-container" id="building-12" style="top: 155px; left: 320px;">
      <div class="edificio" style="width: 75px; height: 30px;">12</div>
      <img src="imagenes/p12.png" alt="Edificio 12" class="hover-image">
    </div>
    <div class="etiqueta estacionamiento-izquierda">estacionamiento</div>
    <div class="etiqueta estacionamiento-derecha rotada">estacionamiento</div>
    <div class="etiqueta estacionamiento-derecha-superior rotada">estacionamiento</div>
    </div>    
    </div>

    <div class="classroom-panel" id="classroomPanel">
      <button id="closePanelBtn">✖</button>
      <h3 id="panelTitle">Salones</h3>
      <div class="rooms">
        <!-- placeholder rooms -->
        <div class="room">A1</div>
        <div class="room">A2</div>
        <div class="room">A3</div>
        <div class="room">A4</div>        
      </div>
    </div>
    

</body>
<script>
  const buildingNames = {
  'building-9': 'Edificio K',
  'building-10': 'Laboratorio de electrónica',
  'building-11': 'Sistemas y Computación',
  'building-12': 'Laboratorio Cómputo Industrial'
};

  const classroomData = {
  'building-9': ['K1', 'K2', 'K3', 'K4', 'K5'],
  'building-10': ['E1', 'E2', 'E3'],
  'building-11': ['S1', 'S2', 'S3', 'S4'],
  'building-12': ['CI1', 'CI2']
};
  const legendItems = document.querySelectorAll('.legend li');
  const mapGroup = document.getElementById('mapContent');


  legendItems.forEach(item => {
    const targetId = item.getAttribute('data-target');
    const building = document.getElementById(targetId);

    item.addEventListener('mouseover', () => {
      if (building) building.classList.add('highlight');
    });

    item.addEventListener('mouseout', () => {
      if (building) building.classList.remove('highlight');
    });

    item.addEventListener('click', () => {
      if (building) {
        showClassrooms(building);
      }
    });
    // Make each building rectangle clickable
const buildings = document.querySelectorAll('.edificio-container');

buildings.forEach(building => {
  building.addEventListener('click', () => {
    showClassrooms(building);
  });
});

  });

  function showClassrooms(buildingElement) {
    const panel = document.getElementById('classroomPanel');
    const mapa = document.getElementById('mapa');
    const roomsContainer = panel.querySelector('.rooms');

    // Get classroom list based on clicked building
  const rooms = classroomData[buildingElement.id] || [];

    // Clear previous rooms
  roomsContainer.innerHTML = '';

  // Add new room divs
  rooms.forEach(room => {
    const roomDiv = document.createElement('div');
    roomDiv.className = 'room';
    roomDiv.textContent = room;
    roomsContainer.appendChild(roomDiv);
  });

  // Show panel
  mapa.style.transform = 'translateX(-200px)';
  panel.classList.add('visible');


    mapa.style.transform = 'translateX(-200px)';
    //panel.style.display = 'block'; // Show the panel when a building is clicked
    const panelTitle = document.getElementById('panelTitle');
panelTitle.textContent = 'Salones – ' + (buildingNames[buildingElement.id] || 'Edificio');

    panel.classList.add('visible'); // test Add the visible class to show the panel 

  }
  document.getElementById('closePanelBtn').addEventListener('click', () => {
  const panel = document.getElementById('classroomPanel');
  const mapa = document.getElementById('mapa');

  //panel.style.display = 'none';
  panel.classList.remove('visible'); // test Remove the visible class to hide the panel
  mapa.style.transform = 'translateX(0)';
});

  
</script>

</html>
